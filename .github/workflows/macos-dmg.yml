name: Build macOS DMG

on:
  workflow_call:

jobs:
  build-macos-dmg:
    name: Build macOS DMG
    runs-on: macos-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0  # Fetch full history for version info

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.12'

      # flac is the one external program ld-compress shells out to, and it has
      # to be 1.5.0 or later for its -j (multithreaded encoding) option.  Built
      # from source with libFLAC and libogg linked in statically so the only
      # thing to drop into the app bundle is the one executable - a Homebrew
      # flac would drag its dylibs along and need its load paths rewritten.
      - name: Build flac for the app bundle
        run: |
          set -euo pipefail
          FLAC_VERSION=1.5.0
          OGG_VERSION=1.3.5
          BUILD_DIR="${GITHUB_WORKSPACE}/flac-build"
          PREFIX="${BUILD_DIR}/prefix"
          mkdir -p "${BUILD_DIR}"
          cd "${BUILD_DIR}"

          curl -fsSLO "https://downloads.xiph.org/releases/ogg/libogg-${OGG_VERSION}.tar.xz"
          curl -fsSLO "https://downloads.xiph.org/releases/flac/flac-${FLAC_VERSION}.tar.xz"
          tar xf "libogg-${OGG_VERSION}.tar.xz"
          tar xf "flac-${FLAC_VERSION}.tar.xz"

          cd "${BUILD_DIR}/libogg-${OGG_VERSION}"
          ./configure --prefix="${PREFIX}" --disable-shared --enable-static --quiet
          make -j"$(sysctl -n hw.ncpu)" > /dev/null
          make install > /dev/null

          cd "${BUILD_DIR}/flac-${FLAC_VERSION}"
          PKG_CONFIG_PATH="${PREFIX}/lib/pkgconfig" ./configure --prefix="${PREFIX}" \
            --disable-shared --enable-static --disable-cpplibs --disable-examples \
            --disable-doxygen-docs --with-ogg="${PREFIX}" --quiet
          make -j"$(sysctl -n hw.ncpu)" > /dev/null

          strip -S -x src/flac/flac
          mkdir -p "${GITHUB_WORKSPACE}/runtime-tools"
          install -m755 src/flac/flac "${GITHUB_WORKSPACE}/runtime-tools/flac"
          "${GITHUB_WORKSPACE}/runtime-tools/flac" --version
          # Nothing outside the OS should be left to link against at runtime
          otool -L "${GITHUB_WORKSPACE}/runtime-tools/flac"

      - name: Install dependencies and build standalone app
        run: |
          # Install build dependencies
          pip install --upgrade pip setuptools wheel
          pip install pyinstaller numpy scipy matplotlib av numba
          
          # Install the package in development mode
          pip install -e .
          
          # Get version
          VERSION=$(python3 -c "from lddecode import __version__; print(__version__)")
          echo "VERSION=${VERSION}" >> $GITHUB_ENV
          echo "Built version: ${VERSION}"
          
          # Create app structure
          APP_NAME="LD-Decode.app"
          APP_DIR="build/${APP_NAME}"
          mkdir -p "${APP_DIR}/Contents/MacOS"
          mkdir -p "${APP_DIR}/Contents/Resources"
          
          # Create entry point scripts for PyInstaller
          mkdir -p /tmp/ld-decode-entrypoints
          
          cat > /tmp/ld-decode-entrypoints/ld-decode-entry.py << 'PYEOF'
          import sys
          from lddecode.main import main
          if __name__ == "__main__":
              sys.exit(main())
          PYEOF
          
          cat > /tmp/ld-decode-entrypoints/ld-ldf-reader-py-entry.py << 'PYEOF'
          import sys
          from lddecode.ldf_reader import main
          if __name__ == "__main__":
              sys.exit(main())
          PYEOF

          cat > /tmp/ld-decode-entrypoints/ld-cut-entry.py << 'PYEOF'
          import sys
          from lddecode.cut import main
          if __name__ == "__main__":
              main(sys.argv[1:])
          PYEOF

          cat > /tmp/ld-decode-entrypoints/ld-lds-converter-py-entry.py << 'PYEOF'
          import sys
          from lddecode.lds import main
          if __name__ == "__main__":
              sys.exit(main())
          PYEOF

          cat > /tmp/ld-decode-entrypoints/ld-compress-entry.py << 'PYEOF'
          import sys
          from lddecode.compress import main
          if __name__ == "__main__":
              try:
                  sys.exit(main())
              except KeyboardInterrupt:
                  sys.exit(130)
          PYEOF

          # Build standalone executables with PyInstaller (onefile binaries placed directly in Contents/MacOS)
          # --windowed is only right for the tools that are never used as a
          # stdio filter; ld-lds-converter-py and ld-compress read and write
          # pipes, so they are built as ordinary console programs.
          for tool in ld-decode ld-ldf-reader-py ld-cut ; do
            pyinstaller --onefile \
              --windowed \
              --hidden-import lddecode \
              --hidden-import sqlite3 \
              --collect-all lddecode \
              --collect-all matplotlib \
              --collect-all numba \
              --collect-all scipy \
              --collect-all av \
              --name "${tool}" \
              --distpath "${APP_DIR}/Contents/MacOS" \
              "/tmp/ld-decode-entrypoints/${tool}-entry.py"
          done

          for tool in ld-lds-converter-py ld-compress ; do
            pyinstaller --onefile \
              --hidden-import lddecode \
              --hidden-import sqlite3 \
              --collect-all lddecode \
              --collect-all numpy \
              --collect-all av \
              --name "${tool}" \
              --distpath "${APP_DIR}/Contents/MacOS" \
              "/tmp/ld-decode-entrypoints/${tool}-entry.py"
          done

          # ld-compress looks for flac beside itself, so this is all the
          # wiring the bundled copy needs
          install -m755 "${GITHUB_WORKSPACE}/runtime-tools/flac" "${APP_DIR}/Contents/MacOS/flac"

      - name: Create Info.plist
        run: |
          APP_DIR="build/LD-Decode.app"
          # Create Info.plist
          cat > "${APP_DIR}/Contents/Info.plist" << EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>CFBundleName</key>
              <string>LD-Decode</string>
              <key>CFBundleDisplayName</key>
              <string>LD-Decode</string>
              <key>CFBundleIdentifier</key>
              <string>org.ld-decode.ld-decode</string>
              <key>CFBundleVersion</key>
              <string>${VERSION}</string>
              <key>CFBundleShortVersionString</key>
              <string>${VERSION}</string>
              <key>CFBundlePackageType</key>
              <string>APPL</string>
              <key>CFBundleExecutable</key>
              <string>ld-decode</string>
              <key>LSMinimumSystemVersion</key>
              <string>11.0</string>
              <key>NSHighResolutionCapable</key>
              <true/>
          </dict>
          </plist>
          EOF
          
          echo "✓ App bundle created successfully at ${APP_DIR}"

      - name: Code sign app bundle
        run: |
          APP_DIR="build/LD-Decode.app"

          # Sign the app bundle with ad-hoc signature
          # This prevents the "damaged" error and allows macOS to show proper security prompt
          # Nested executables are signed first: on Apple silicon every binary
          # needs a valid signature of its own before the enclosing bundle is
          # sealed, and flac was copied in rather than built here.
          echo "Signing executables..."
          for binary in "${APP_DIR}/Contents/MacOS"/* ; do
            codesign -s - --force --timestamp=none "${binary}"
          done

          echo "Signing app bundle..."
          codesign -s - --deep --force "${APP_DIR}"

          # Verify signature
          codesign -vv "${APP_DIR}" 2>&1 || true
          echo "✓ App bundle signed successfully"

      - name: Test app bundle
        run: |
          set -euo pipefail
          APP_DIR="${PWD}/build/LD-Decode.app"
          export PATH="${APP_DIR}/Contents/MacOS:${PATH}"

          echo "Testing the bundled tools..."
          ld-decode --version
          ld-compress --version
          flac --version

          # A full ld-compress round trip: this is what catches a flac that is
          # missing, too old, or not relocatable off the build machine.
          WORK="$(mktemp -d)"
          mkdir -p "${WORK}/out"
          cd "${WORK}"
          head -c 4000000 /dev/urandom > raw.s16
          ld-lds-converter-py -p -i raw.s16 -o sample.lds
          ld-compress -n sample.lds
          (cd out && ld-compress -n -u ../sample.ldf)
          cmp sample.lds out/sample.lds
          cd - > /dev/null
          rm -rf "${WORK}"

          echo "✓ App bundle is functional and the ld-compress round trip is lossless"

      - name: Create DMG
        run: |
          VERSION="${{ env.VERSION }}"
          SAFE_VERSION=${VERSION//:/-}
          
          APP_NAME="LD-Decode.app"
          APP_DIR="build/${APP_NAME}"
          DMG_NAME="ld-decode-${SAFE_VERSION}-macOS.dmg"
          TEMP_DMG="temp.dmg"
          
          # Create a temporary directory for DMG contents
          DMG_DIR="build/dmg"
          mkdir -p "${DMG_DIR}"
          
          # Copy the app bundle
          cp -r "${APP_DIR}" "${DMG_DIR}/"
          
          # Create README for users
          cat > "${DMG_DIR}/README.txt" << 'EOF'
          LD-Decode for macOS
          ===================
          
          Installation:
          1. Drag LD-Decode.app to the Applications folder
          
          2. On first run, macOS may show a security warning because the app
             is not notarized. Click "OK", then:
             - Go to System Settings > Privacy & Security
             - Scroll down and click "Open Anyway" next to the LD-Decode warning
             - Click "Open" in the confirmation dialog
          
          3. (Optional) Add to PATH for command-line access:
             echo 'export PATH="/Applications/LD-Decode.app/Contents/MacOS:$PATH"' >> ~/.zshrc
             source ~/.zshrc

          Tools included:
          - ld-decode
          - ld-cut
          - ld-compress
          - ld-ldf-reader-py
          - ld-lds-converter-py

          Usage:
          - Run from Terminal: ld-decode [arguments]
          - Or: /Applications/LD-Decode.app/Contents/MacOS/ld-decode [arguments]

          All required dependencies are included in the app bundle, including
          the flac 1.5.0 that ld-compress uses for multithreaded encoding.
          EOF
          
          # Calculate DMG size (app size + 50MB padding)
          APP_SIZE=$(du -sm "${DMG_DIR}" | cut -f1)
          DMG_SIZE=$((APP_SIZE + 50))
          
          # Create DMG
          hdiutil create -size ${DMG_SIZE}m -fs HFS+ -volname "LD-Decode" "${TEMP_DMG}"
          
          # Mount DMG
          MOUNT_DIR=$(hdiutil attach -readwrite -noverify -noautoopen "${TEMP_DMG}" | grep Volumes | cut -f3)
          
          # Copy contents
          cp -r "${DMG_DIR}/"* "${MOUNT_DIR}/"
          
          # Create a symlink to /Applications inside the mounted DMG
          ln -s /Applications "${MOUNT_DIR}/Applications"
          
          # Unmount
          sync
          hdiutil detach "${MOUNT_DIR}"
          
          # Convert to compressed final DMG
          hdiutil convert "${TEMP_DMG}" -format UDZO -o "${DMG_NAME}"
          
          # Clean up
          rm "${TEMP_DMG}"
          
          # Move to build directory
          mv "${DMG_NAME}" build/
          
          echo "DMG created: ${DMG_NAME}"
          ls -lh "build/${DMG_NAME}"

      - name: Upload DMG as artifact
        uses: actions/upload-artifact@v4
        with:
          name: ld-decode-macos-dmg
          path: |
            build/ld-decode-*.dmg
          retention-days: 30

      - name: Upload DMG to Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v1
        with:
          files: |
            build/ld-decode-*.dmg
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
