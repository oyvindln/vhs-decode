name: "Push to PyPI"

on:
  workflow_dispatch:

jobs:
  build-wheels:
    name: Build wheels on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    env:
      CIBW_SKIP: "cp38-* cp39-* cp310-* pp* cp311-macosx_arm64 cp312-macosx_arm64 cp311-win_amd64"
      CIBW_ARCHS_LINUX: "x86_64"
      CIBW_ARCHS_WINDOWS: "AMD64"
      CIBW_ARCHS_MACOS: "arm64 universal2"

    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          fetch-tags: true

      - uses: actions/setup-python@v6

      - name: Generate version metadata
        shell: bash
        run: python scripts/generate_version.py > lddecode/version

      - name: Build wheels
        uses: pypa/cibuildwheel@v3.1.3

      - uses: actions/upload-artifact@v7
        with:
          name: vhs-decode-wheels-${{ matrix.os }}-${{ strategy.job-index }}
          path: ./wheelhouse/*.whl
          if-no-files-found: error

  create-sdist:
    name: Create source distribution
    runs-on: ubuntu-22.04

    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Generate version metadata
        run: python3 scripts/generate_version.py > lddecode/version

      - name: Create the sdist
        run: |
          pipx run build --sdist

      - name: Store the sdist
        uses: actions/upload-artifact@v7
        with:
          name: vhs-decode-sdist
          path: dist/*.tar.gz
          if-no-files-found: error

  publish-to-pypi:
    name: Publish to PyPI
    runs-on: ubuntu-22.04

    needs:
      - build-wheels
      - create-sdist

    environment:
      name: pypi
      url: https://pypi.org/p/vhs-decode

    permissions:
      id-token: write # IMPORTANT: mandatory for trusted publishing

    steps:
      - name: Download all the artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: vhs-decode-*
          path: dist
          merge-multiple: true

      - name: Publish packages to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
