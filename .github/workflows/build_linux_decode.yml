name: "Build Linux decode"

on:
  workflow_dispatch:
  workflow_call:
    inputs:
      checkout_ref:
        description: "Git ref to checkout when invoked as a reusable workflow"
        required: false
        type: string

jobs:
  build-decode:
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            os: ubuntu-24.04
          - arch: arm64
            os: ubuntu-24.04-arm
    name: Build decode (${{ matrix.arch }})
    runs-on: ${{ matrix.os }}
    container:
      image: oraclelinux:8
      options: --cap-add SYS_ADMIN --cap-add MKNOD --device /dev/fuse:mrw --security-opt apparmor:unconfined --privileged

    steps:
      - name: Setup environment
        run: |
          dnf install --assumeyes git python3.12-pip gcc-c++ file fuse fuse-libs
          if ! dnf install --assumeyes portaudio; then
            dnf install --assumeyes oracle-epel-release-el8 || \
              dnf install --assumeyes https://dl.fedoraproject.org/pub/epel/epel-release-latest-8.noarch.rpm
            dnf install --assumeyes portaudio
          fi

      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          fetch-tags: true
          ref: ${{ inputs.checkout_ref || github.ref }}
      - name: Mark workspace as safe for git
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - uses: dtolnay/rust-toolchain@stable

      - name: Create AppImage
        env:
          SETUPTOOLS_RUST_CARGO_PROFILE: release
        run: |
          pip3 install python-appimage
          mkdir _build_appimage

          cp assets/icons/vhs-decode.png _build_appimage/
          cp resources/appimage/decode/entrypoint.sh _build_appimage/
          cp resources/appimage/decode/vhs-decode.desktop _build_appimage/
          cp resources/appimage/decode/vhs-decode.appdata.xml _build_appimage/
          {
            echo "PyQt6==6.7.1"
            echo "$(pwd)[hifi_gui_qt6,hifi_gnuradio]"
          } > _build_appimage/requirements.txt
          PORTAUDIO_LIB_PATH="$(rpm -ql portaudio | grep -E 'libportaudio\.so\.2$' | head -n 1)"
          if [ -z "${PORTAUDIO_LIB_PATH}" ] || [ ! -f "${PORTAUDIO_LIB_PATH}" ]; then
            echo "Failed to locate libportaudio.so.2 from the portaudio package."
            exit 1
          fi
          cp "${PORTAUDIO_LIB_PATH}" _build_appimage/libportaudio.so.2
          ln -sf libportaudio.so.2 _build_appimage/libportaudio.so

          # Pre-download ffmpeg/ffprobe directly via curl so they are
          # bundled in the AppImage instead of downloaded at runtime.
          # This is REQUIRED — self-contained binaries must include ffmpeg.
          # We download directly from the static_ffmpeg bin repo to avoid
          # Python dependency issues in the OracleLinux 8 container.
          FFMPEG_ZIP_URL="https://github.com/zackees/ffmpeg_bins/raw/main/v5.0/linux.zip"
          if [ "${{ matrix.arch }}" = "arm64" ]; then
            FFMPEG_ZIP_URL="https://github.com/zackees/ffmpeg_bins/raw/main/v5.0/linux-aarch64.zip"
          fi
          FFMPEG_ZIP="$(mktemp /tmp/ffmpeg-XXXXXX.zip)"
          FFMPEG_EXTRACT="$(mktemp -d /tmp/ffmpeg-extract-XXXXXX)"
          curl -fsSL "${FFMPEG_ZIP_URL}" -o "${FFMPEG_ZIP}" || { echo "ERROR: failed to download ffmpeg from ${FFMPEG_ZIP_URL}"; exit 1; }
          python3 -c "import zipfile; zipfile.ZipFile('${FFMPEG_ZIP}').extractall('${FFMPEG_EXTRACT}')" || { echo "ERROR: failed to extract ffmpeg zip"; exit 1; }
          FFMPEG_BIN="$(find "${FFMPEG_EXTRACT}" -type f -name 'ffmpeg' | head -n 1)"
          FFPROBE_BIN="$(find "${FFMPEG_EXTRACT}" -type f -name 'ffprobe' | head -n 1)"
          if [ -z "${FFMPEG_BIN}" ] || [ ! -f "${FFMPEG_BIN}" ]; then
            echo "ERROR: ffmpeg binary not found in extracted zip. Self-contained binaries require bundled ffmpeg."
            exit 1
          fi
          echo "Bundling ffmpeg from ${FFMPEG_BIN}"
          cp "${FFMPEG_BIN}" _build_appimage/ffmpeg
          [ -n "${FFPROBE_BIN}" ] && [ -f "${FFPROBE_BIN}" ] && cp "${FFPROBE_BIN}" _build_appimage/ffprobe || touch _build_appimage/ffprobe
          EXTRA_FLAGS=" -x _build_appimage/ffmpeg -x _build_appimage/ffprobe"
          rm -f "${FFMPEG_ZIP}"
          rm -rf "${FFMPEG_EXTRACT}"

          python-appimage build app -p 3.12 \
            -x _build_appimage/libportaudio.so.2 \
            -x _build_appimage/libportaudio.so \
            ${EXTRA_FLAGS} \
            -- \
            _build_appimage
          APPIMAGE_SRC="$(find . -maxdepth 1 -type f -name '*.AppImage' | head -n 1)"
          if [ -z "${APPIMAGE_SRC}" ]; then
            echo "Failed to locate generated AppImage."
            exit 1
          fi
          mv "${APPIMAGE_SRC}" "./decode-${{ matrix.arch }}.AppImage"

      - name: Smoke test AppImage binary startup (crash regression)
        run: |
          set -euo pipefail
          APPIMAGE_PATH="./decode-${{ matrix.arch }}.AppImage"
          # The binary MUST start without crashing. This catches import
          # errors (e.g. static_ffmpeg.add_paths() downloading/locking
          # on a read-only mount) before the binary reaches users.
          "${APPIMAGE_PATH}" ld --version

      - name: Smoke test AppImage hifi preview dependency bundle
        run: |
          set -euo pipefail
          APPIMAGE_PATH="./decode-${{ matrix.arch }}.AppImage"
          # Extract the AppImage contents. --appimage-extract needs fuse;
          # fall back to unsquashfs if fuse isn't working in the container.
          rm -rf squashfs-root
          if ! "${APPIMAGE_PATH}" --appimage-extract 2>/dev/null; then
            echo "--appimage-extract failed, trying unsquashfs..."
            dnf install --assumeyes squashfs-tools 2>/dev/null || true
            unsquashfs -d squashfs-root "${APPIMAGE_PATH}" || { echo "ERROR: could not extract AppImage"; exit 1; }
          fi
          APPDIR_PATH="${PWD}/squashfs-root"
          BUNDLED_PYTHON="$(find "${APPDIR_PATH}/opt" -maxdepth 3 -type f -name 'python3.*' | grep '/bin/python3\.' | head -n 1)"
          BUNDLED_PORTAUDIO="$(find "${APPDIR_PATH}" \( -type f -o -type l \) \( -name 'libportaudio.so.2' -o -name 'libportaudio.so' \) | head -n 1)"
          BUNDLED_FFMPEG="$(find "${APPDIR_PATH}" -type f -name 'ffmpeg' | head -n 1)"
          if [ -z "${BUNDLED_PYTHON}" ] || [ ! -x "${BUNDLED_PYTHON}" ]; then
            echo "Failed to locate bundled Python interpreter in AppImage."
            exit 1
          fi
          if [ -z "${BUNDLED_PORTAUDIO}" ]; then
            echo "Failed to locate bundled libportaudio shared library inside AppImage."
            exit 1
          fi
          if [ -z "${BUNDLED_FFMPEG}" ]; then
            echo "ERROR: ffmpeg is not bundled in the AppImage. Self-contained binaries must include ffmpeg."
            exit 1
          fi
          echo "Found bundled ffmpeg: ${BUNDLED_FFMPEG}"
          echo "Found bundled portaudio: ${BUNDLED_PORTAUDIO}"
          APPDIR="${APPDIR_PATH}" "${BUNDLED_PYTHON}" -I -c "import os; from vhsdecode.hifi.main import _sounddevice_available; assert _sounddevice_available(); import sounddevice as sd; lib_path = os.path.realpath(getattr(sd, '_libname', '')); assert lib_path.startswith(os.path.realpath(os.environ['APPDIR'])), lib_path; assert 'portaudio' in os.path.basename(lib_path).lower(), lib_path"
          rm -rf squashfs-root

      - name: Upload binary artifact
        uses: actions/upload-artifact@v7
        with:
          name: decode_linux_${{ matrix.arch }}
          path: decode-${{ matrix.arch }}.AppImage
          if-no-files-found: error
